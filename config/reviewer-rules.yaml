# Ferry reviewer-rules — declarative checks the Reviewer agent applies before
# inspecting the diff for logic bugs.
#
# Each rule has:
#   id:        stable identifier referenced in findings
#   when:      JSONPath-like guard for when the rule applies (paths/diff/PR)
#   require:   what must be true (else fail with `message` + `proposed_fix`)
#   severity:  blocker | warning | info
#
# Rules grouped by category. Add project-specific rules at the bottom.

version: 1

rules:
  # ─────────────────────────────────────────────────────────────
  # Hygiene
  # ─────────────────────────────────────────────────────────────
  - id: no-co-authored-by
    when:
      pr.commits[*].message: '*'
    require:
      not_match: '(?i)co-authored-by'
    severity: blocker
    message: 'Commit contains a Co-Authored-By trailer; Ferry policy forbids them.'
    proposed_fix: 'Squash or amend the commit to remove the trailer.'

  - id: conventional-commit
    when:
      pr.commits[*].message: '*'
    require:
      match: '^(feat|fix|chore|refactor|test|docs|build|ci|perf|style)(\([a-z0-9-]+\))?: .{1,80}$'
    severity: warning
    message: "Commit subject doesn't follow Conventional Commits."
    proposed_fix: 'Reword the subject as `type(scope): <imperative summary>`.'

  # ─────────────────────────────────────────────────────────────
  # Tests
  # ─────────────────────────────────────────────────────────────
  - id: tests-accompany-source-changes
    when:
      pr.files[*].path: 'src/**/*.ts'
      pr.files[*].status: 'added | modified'
    require:
      sibling_test_modified_or_added: true
    severity: blocker
    message: 'Source change without a corresponding test file change.'
    proposed_fix: 'Add or update a *.test.ts file covering the new behavior.'

  - id: no-skipped-tests
    when:
      pr.files[*].path: '**/*.test.ts'
    require:
      not_match: '(?m)^\s*(it|test|describe)\.skip\b'
    severity: warning
    message: 'A test was marked .skip — it will not run in CI.'
    proposed_fix: 'Remove .skip or open a follow-up issue with rationale.'

  # ─────────────────────────────────────────────────────────────
  # Security
  # ─────────────────────────────────────────────────────────────
  - id: no-hardcoded-secrets
    when:
      pr.files[*].patch: '*'
    require:
      not_match: '(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*["''][A-Za-z0-9_\-]{16,}["'']'
    severity: blocker
    message: 'Possible hardcoded secret in diff.'
    proposed_fix: 'Move the value to a repository secret and reference via process.env.'

  - id: gitleaks-clean
    when:
      ci.checks[*].name: 'gitleaks'
    require:
      conclusion: 'success'
    severity: blocker
    message: 'Gitleaks reported a finding; commit history may contain a leaked secret.'
    proposed_fix: 'Rotate the leaked credential and rewrite history (or open a security issue).'

  # ─────────────────────────────────────────────────────────────
  # Schema and contract
  # ─────────────────────────────────────────────────────────────
  - id: schema-version-bumped-when-shape-changes
    when:
      pr.files[*].path: 'src/schemas/*.v*.schema.json'
      pr.files[*].status: 'modified'
    require:
      filename_version_matches_$id: true
    severity: blocker
    message: 'Schema shape changed without bumping the version filename + $id.'
    proposed_fix: 'Create state.v2.schema.json (etc.) instead of modifying v1; preserve v1 for rollback.'

  # ─────────────────────────────────────────────────────────────
  # Operational
  # ─────────────────────────────────────────────────────────────
  - id: ferry-never-merges
    when:
      pr.diff.added_lines: '*'
    require:
      not_match: '(?m)octokit\.rest\.pulls\.merge|octokit\.pulls\.merge'
    severity: blocker
    message: "Code calls a merge endpoint; Ferry's invariant is `never merges`."
    proposed_fix: 'Remove the merge call. Only humans merge in Ferry.'

  - id: ferry-never-moves-jira-columns-except-allowed
    when:
      pr.diff.added_lines: '*match.*jiraTransition.*'
    require:
      transition_in_allowlist: ['In Review', 'Ready to Merge', 'Changes Requested']
    severity: blocker
    message: 'Code performs a Jira column transition outside the FR18/FR24/FR28 allowlist.'
    proposed_fix: 'Restrict the transition or remove the call.'

# Project-specific rules go below. Each rule needs id, when, require, severity.
project_rules: []
