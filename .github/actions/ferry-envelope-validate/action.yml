name: Ferry — Validate Event Envelope
description: Validates repository_dispatch payload against event.v1.schema.json. No payload content is logged on failure.
inputs:
  payload:
    description: JSON-encoded github.event.client_payload
    required: true
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version: '20'
    # Dependencies are vendored: node_modules is committed in this action
    # directory and checked out with the action, so no install is needed. The
    # previous `npm ci --prefer-offline` step only deleted the committed
    # node_modules and cold-reinstalled it from the registry on every run.
    - name: Validate envelope
      shell: bash
      run: node ${{ github.action_path }}/validate-action.js
      env:
        FERRY_ENVELOPE_PAYLOAD: ${{ inputs.payload }}
