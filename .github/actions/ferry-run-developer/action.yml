name: Ferry — Run Developer Agent
description: >
  Runs the Developer agent. Self-contained; no .ferry/ needed in the consumer workspace.
  Bundle and dependencies are resolved from github.action_path (the ferry repo).
inputs:
  payload:
    description: JSON-encoded event envelope payload
    required: true
  jira_base_url:
    description: Jira base URL
    required: true
  jira_email:
    description: Jira account email
    required: true
  jira_api_token:
    description: Jira API token
    required: true
  ferry_review_transition_id:
    description: Jira transition ID to move ticket to In Review
    required: true
  anthropic_api_key:
    description: Anthropic API key
    required: true
  github_token:
    description: GitHub token with contents:write and pull-requests:write
    required: true
  github_repo:
    description: GitHub repository (owner/repo)
    required: true
  ferry_dev_model:
    description: Model override (e.g. claude-opus-4-5)
    required: false
    default: ''
  ferry_dev_provider:
    description: LLM provider override (anthropic / openai / google)
    required: false
    default: ''
  ferry_dev_max_input_tokens:
    description: Input token budget per run (overrides limits.max_tokens_per_run)
    required: false
    default: ''
  ferry_dev_max_tokens:
    description: Maximum output tokens per LLM call (overrides limits.max_tokens_per_message)
    required: false
    default: ''
  ferry_dev_max_iterations:
    description: Maximum agent loop iterations per run (overrides limits.max_agent_iterations)
    required: false
    default: ''
  ferry_bash_timeout_max_ms:
    description: Maximum bash command timeout the agent may request in ms (overrides limits.bash_timeout_max_ms)
    required: false
    default: ''
  ferry_max_cost_eur_per_run:
    description: Cost budget in EUR per agent run (overrides limits.max_cost_eur_per_run)
    required: false
    default: ''
  ferry_llm_retry_max_attempts:
    description: Maximum retry attempts for LLM utility calls
    required: false
    default: ''
  ferry_jira_retry_max_attempts:
    description: Maximum Jira API retry attempts per operation
    required: false
    default: ''
  pre_agent_command:
    description: Optional shell command to run after checkout but before the agent (e.g. npm ci, cache restore)
    required: false
    default: ''
  pre_agent_timeout_minutes:
    description: Timeout in minutes for the pre-agent command (default 3)
    required: false
    default: '3'
  post_agent_command:
    description: Optional shell command to run after the agent; always executes (e.g. cleanup, reporting)
    required: false
    default: ''
outputs:
  input_tokens:
    description: Number of LLM input tokens consumed
    value: ${{ steps.run-developer.outputs.input_tokens }}
  output_tokens:
    description: Number of LLM output tokens consumed
    value: ${{ steps.run-developer.outputs.output_tokens }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version: '20'
    - name: Install Ferry agent dependencies
      shell: bash
      run: npm ci --prefer-offline
      working-directory: ${{ github.action_path }}
    - name: Skip Task tickets (FR6)
      shell: bash
      run: node ${{ github.action_path }}/skip-task-type-action.js
      env:
        FERRY_AGENT_ROLE: developer
        FERRY_ENVELOPE_PAYLOAD: ${{ inputs.payload }}
        FERRY_JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        FERRY_JIRA_EMAIL: ${{ inputs.jira_email }}
        FERRY_JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
    - name: Pre-agent setup
      if: inputs.pre_agent_command != ''
      shell: bash
      run: ${{ inputs.pre_agent_command }}
    - name: Run Developer agent
      id: run-developer
      shell: bash
      run: node ${{ github.action_path }}/dev-action.js
      env:
        FERRY_ENVELOPE_PAYLOAD: ${{ inputs.payload }}
        FERRY_JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        FERRY_JIRA_EMAIL: ${{ inputs.jira_email }}
        FERRY_JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
        FERRY_REVIEW_TRANSITION_ID: ${{ inputs.ferry_review_transition_id }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPO: ${{ inputs.github_repo }}
        FERRY_DEV_MODEL: ${{ inputs.ferry_dev_model }}
        FERRY_DEV_PROVIDER: ${{ inputs.ferry_dev_provider }}
        FERRY_DEV_MAX_INPUT_TOKENS: ${{ inputs.ferry_dev_max_input_tokens }}
        FERRY_DEV_MAX_TOKENS: ${{ inputs.ferry_dev_max_tokens }}
        FERRY_DEV_MAX_ITERATIONS: ${{ inputs.ferry_dev_max_iterations }}
        FERRY_BASH_TIMEOUT_MAX_MS: ${{ inputs.ferry_bash_timeout_max_ms }}
        FERRY_MAX_COST_EUR_PER_RUN: ${{ inputs.ferry_max_cost_eur_per_run }}
        FERRY_LLM_RETRY_MAX_ATTEMPTS: ${{ inputs.ferry_llm_retry_max_attempts }}
        FERRY_JIRA_RETRY_MAX_ATTEMPTS: ${{ inputs.ferry_jira_retry_max_attempts }}
        FERRY_BUNDLED_PROMPTS_DIR: ${{ github.action_path }}/prompts
    - name: Post-agent command
      if: always() && inputs.post_agent_command != ''
      shell: bash
      run: ${{ inputs.post_agent_command }}
