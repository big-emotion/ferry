name: Ferry — Run Iterator Agent
description: >
  Runs the Iterator agent. Self-contained; no .ferry/ needed in the consumer workspace.
  Bundle and dependencies are resolved from github.action_path (the ferry repo).
inputs:
  payload:
    description: JSON-encoded event envelope payload
    required: true
  jira_base_url:
    description: Jira base URL
    required: true
  jira_email:
    description: Jira account email
    required: true
  jira_api_token:
    description: Jira API token
    required: true
  ferry_review_transition_id:
    description: Jira transition ID to move ticket to In Review
    required: true
  anthropic_api_key:
    description: Anthropic API key
    required: true
  github_token:
    description: GitHub token with contents:write, issues:write, and pull-requests:write
    required: true
  github_repo:
    description: GitHub repository (owner/repo)
    required: true
  ferry_iter_model:
    description: Model override (e.g. claude-sonnet-4-6)
    required: false
    default: ''
  ferry_iter_max_input_tokens:
    description: Max input token budget per run
    required: false
    default: '500000'
outputs:
  input_tokens:
    description: Number of LLM input tokens consumed
    value: ${{ steps.run-iterator.outputs.input_tokens }}
  output_tokens:
    description: Number of LLM output tokens consumed
    value: ${{ steps.run-iterator.outputs.output_tokens }}
  model:
    description: Model ID actually used
    value: ${{ steps.run-iterator.outputs.model }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
      with:
        node-version: '20'
    - name: Install Ferry agent dependencies
      shell: bash
      run: npm ci --prefer-offline
      working-directory: ${{ github.action_path }}
    - name: Skip Task tickets (FR6)
      shell: bash
      run: node ${{ github.action_path }}/skip-task-type-action.js
      env:
        FERRY_AGENT_ROLE: iterator
        FERRY_ENVELOPE_PAYLOAD: ${{ inputs.payload }}
        FERRY_JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        FERRY_JIRA_EMAIL: ${{ inputs.jira_email }}
        FERRY_JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
    - name: Run Iterator agent
      id: run-iterator
      shell: bash
      run: node ${{ github.action_path }}/iterate-action.js
      env:
        FERRY_ENVELOPE_PAYLOAD: ${{ inputs.payload }}
        FERRY_JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        FERRY_JIRA_EMAIL: ${{ inputs.jira_email }}
        FERRY_JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
        FERRY_REVIEW_TRANSITION_ID: ${{ inputs.ferry_review_transition_id }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPO: ${{ inputs.github_repo }}
        FERRY_ITER_MODEL: ${{ inputs.ferry_iter_model }}
        FERRY_DEV_MAX_INPUT_TOKENS: ${{ inputs.ferry_iter_max_input_tokens }}
        FERRY_BUNDLED_PROMPTS_DIR: ${{ github.action_path }}/prompts
