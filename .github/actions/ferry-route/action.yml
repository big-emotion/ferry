name: Ferry — Resolve Execution Path
description: >
  Decides whether the agent run takes the bundled-script path or the
  `claude-code-action` path, or the `openai/codex-action` path. Exposes the decision
  to the wrapping workflow via the `path` and `reason` outputs. When `role` is
  omitted, also derives which agent the dispatch targets (router model): legacy
  event types map directly; the generic `ferry-transition` event maps its
  `to_status` against the `workflow.agents.*.trigger_column` names — never onto
  the merger (ADR-0005). Self-contained; no `.ferry/` needed in the consumer
  workspace.
inputs:
  payload:
    description: JSON-encoded event envelope payload
    required: true
  role:
    description: >-
      Agent role (refiner | developer | reviewer | iterator | merger). Optional —
      when empty, the role is derived from `event_type` (+ payload `to_status`
      for ferry-transition).
    required: false
    default: ''
  event_type:
    description: >-
      The repository_dispatch event type (`github.event.action`). Required for
      role derivation when `role` is not provided.
    required: false
    default: ''
  jira_base_url:
    description: Jira base URL
    required: true
  jira_email:
    description: Jira account email
    required: true
  jira_api_token:
    description: Jira API token
    required: true
outputs:
  path:
    description: >-
      Resolved execution path — `script`, `claude-code`, `codex-cli`, or `none`
      when the dispatch maps to no agent (router no-op)
    value: ${{ steps.route.outputs.path }}
  reason:
    description: >-
      Reason for the decision — `default`, `label`, `heuristic`,
      `provider-gate`, or `unmapped-status`
    value: ${{ steps.route.outputs.reason }}
  role:
    description: >-
      Resolved agent role — `refiner`, `developer`, `reviewer`, `iterator`,
      `merger`, or `none`
    value: ${{ steps.route.outputs.role }}
  phase:
    description: Audit phase token for the resolved role (`refine` … `merge`); empty on no-op
    value: ${{ steps.route.outputs.phase }}
  model_var:
    description: >-
      Repo-variable name carrying the model override for the resolved role
      (e.g. `FERRY_DEV_MODEL`); empty on no-op. Look up with `vars[...]`.
    value: ${{ steps.route.outputs.model_var }}
  cc_agent:
    description: >-
      The resolved role in ferry-cc-prompt / ferry-run-claude-agent naming —
      `refiner`, `dev`, `review`, `iterate`, `merge`; empty on no-op.
    value: ${{ steps.route.outputs.cc_agent }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '20'
    - name: Install Ferry action dependencies
      shell: bash
      run: npm ci --prefer-offline
      working-directory: ${{ github.action_path }}
    - name: Resolve execution path
      id: route
      shell: bash
      run: node ${{ github.action_path }}/route-action.js
      env:
        FERRY_ENVELOPE_PAYLOAD: ${{ inputs.payload }}
        FERRY_AGENT_ROLE: ${{ inputs.role }}
        FERRY_EVENT_TYPE: ${{ inputs.event_type }}
        FERRY_JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        FERRY_JIRA_EMAIL: ${{ inputs.jira_email }}
        FERRY_JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
