name: Ferry — Review

on:
  repository_dispatch:
    types: [ferry-review]
  workflow_call:
    inputs:
      ticket_key:
        required: true
        type: string
      event_id:
        required: true
        type: string
      payload:
        required: true
        type: string

# cancel-in-progress: false — writes fingerprints to state.iteration_history[] + PR review body; must complete atomically
concurrency:
  group: ferry-${{ github.workflow }}-${{ inputs.ticket_key || github.event.client_payload.ticket_key || 'ferry-invalid-payload-sinkhole' }}
  cancel-in-progress: false

jobs:
  gate-envelope:
    name: Validate event envelope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate event envelope
        uses: big-emotion/ferry/.github/actions/ferry-envelope-validate@v0.5.3
        with:
          payload: ${{ inputs.payload || toJson(github.event.client_payload) }}

  run-agent:
    name: Run Reviewer agent
    needs: [gate-envelope]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    outputs:
      input_tokens: ${{ steps.run-reviewer.outputs.input_tokens }}
      output_tokens: ${{ steps.run-reviewer.outputs.output_tokens }}
      model: ${{ steps.run-reviewer.outputs.model }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Reviewer agent
        id: run-reviewer
        uses: big-emotion/ferry/.github/actions/ferry-run-reviewer@v0.5.3
        with:
          payload: ${{ inputs.payload || toJson(github.event.client_payload) }}
          jira_base_url: ${{ secrets.FERRY_JIRA_BASE_URL }}
          jira_email: ${{ secrets.FERRY_JIRA_EMAIL }}
          jira_api_token: ${{ secrets.FERRY_JIRA_API_TOKEN }}
          ferry_iter_transition_id: ${{ secrets.FERRY_ITER_TRANSITION_ID }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          github_repo: ${{ github.repository }}
          ferry_review_model: ${{ vars.FERRY_REVIEW_MODEL || 'claude-sonnet-4-6' }}

  emit-audit:
    name: Emit audit line
    needs: [run-agent]
    if: needs.run-agent.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Emit audit line
        uses: big-emotion/ferry/.github/actions/ferry-emit-audit@v0.5.3
        with:
          ticket: ${{ inputs.ticket_key || github.event.client_payload.ticket_key }}
          phase: review
          run_id: ${{ inputs.event_id || github.event.client_payload.event_id }}
          model: ${{ needs.run-agent.outputs.model || 'claude-sonnet-4-6' }}
          outcome: ${{ needs.run-agent.result }}
          input_tokens: ${{ needs.run-agent.outputs.input_tokens || '0' }}
          output_tokens: ${{ needs.run-agent.outputs.output_tokens || '0' }}
          start_ms: ${{ github.run_id }}
          audit_issue: ${{ vars.FERRY_AUDIT_ISSUE }}
          github_token: ${{ github.token }}
