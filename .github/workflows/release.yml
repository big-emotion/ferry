name: Release

on:
  push:
    tags: ['v*.*.*']

# Prevent concurrent releases for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Verify & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # npm provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: npm Audit
        run: npm run audit:ci

      - name: Build .ferry/ bundles
        run: npm run build:ferry

      - name: Assert no .ferry/ drift
        run: git diff --exit-code .ferry/

      - name: Build CLI bundles
        run: npm run build:cli

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found — release notes will be auto-generated"
            echo "has-notes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { p=1; next }
            /^## \[/ && p { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No section [${VERSION}] found in CHANGELOG.md — release notes will be auto-generated"
            echo "has-notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (CHANGELOG notes)
        if: steps.notes.outputs.has-notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.notes.outputs.version }}" \
            --title "v${{ steps.notes.outputs.version }}" \
            --notes-file release-notes.md

      - name: Create GitHub Release (auto-generated fallback)
        if: steps.notes.outputs.has-notes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.notes.outputs.version }}" \
            --title "v${{ steps.notes.outputs.version }}" \
            --generate-notes

      - name: Update moving major tag
        run: bash scripts/retag-major.sh "${{ github.ref_name }}"
