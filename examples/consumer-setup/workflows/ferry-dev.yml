# Copy this file to .github/workflows/ferry-dev.yml in your repository.
# Replace @v0.4.0 with the Ferry release tag you want to pin (e.g. @v0.5.0).
# Required secrets: FERRY_JIRA_BASE_URL, FERRY_JIRA_EMAIL, FERRY_JIRA_API_TOKEN,
#                   FERRY_REVIEW_TRANSITION_ID, ANTHROPIC_API_KEY
# Required variables: FERRY_AUDIT_ISSUE (GitHub Issue number for the audit log)
# Developer model: hardcoded to claude-sonnet-4-6 in the reusable dev.yml.
# To override, set models.dev.model in ferry.config.yaml.

name: Ferry — Dev

on:
  repository_dispatch:
    types: [ferry-dev]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Concurrency is managed by the reusable workflow (dev.yml). Adding a concurrency block here
# would deadlock: github.workflow resolves to the caller's name in both contexts, making the
# group keys identical. The caller would hold the lock while the reusable waits for it.

jobs:
  dev:
    uses: big-emotion/ferry/.github/workflows/dev.yml@v0.4.0
    with:
      ticket_key: ${{ github.event.client_payload.ticket_key }}
      event_id: ${{ github.event.client_payload.event_id }}
      payload: ${{ toJson(github.event.client_payload) }}
    secrets: inherit
