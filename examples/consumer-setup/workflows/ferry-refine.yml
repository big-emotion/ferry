# Copy this file to .github/workflows/ferry-refine.yml in your repository.
# Replace @v0.5.3 with the Ferry release tag you want to pin (e.g. @v0.6.0).
# Required secrets: FERRY_JIRA_BASE_URL, FERRY_JIRA_EMAIL, FERRY_JIRA_API_TOKEN, ANTHROPIC_API_KEY
# Required variables: FERRY_AUDIT_ISSUE (GitHub Issue number for the audit log)

name: Ferry — Refine

on:
  repository_dispatch:
    types: [ferry-refine]

permissions:
  contents: read
  issues: write

# Concurrency is managed by the reusable workflow (refine.yml). Adding a concurrency block here
# would deadlock: github.workflow resolves to the caller's name in both contexts, making the
# group keys identical. The caller would hold the lock while the reusable waits for it.

jobs:
  refine:
    uses: big-emotion/ferry/.github/workflows/refine.yml@v0.5.3
    with:
      ticket_key: ${{ github.event.client_payload.ticket_key }}
      event_id: ${{ github.event.client_payload.event_id }}
      payload: ${{ toJson(github.event.client_payload) }}
    secrets: inherit
