# Copy this file to .github/workflows/ferry-review.yml in your repository.
# Replace @v0.6.0 with the Ferry release tag you want to pin (e.g. @v0.7.0).
# Required secrets: FERRY_JIRA_BASE_URL, FERRY_JIRA_EMAIL, FERRY_JIRA_API_TOKEN,
#                   FERRY_ITER_TRANSITION_ID, ANTHROPIC_API_KEY
# Required variables: FERRY_AUDIT_ISSUE (GitHub Issue number for the audit log)
# Optional variables: FERRY_REVIEW_MODEL (default: claude-sonnet-4-6)

name: Ferry — Review

on:
  repository_dispatch:
    types: [ferry-review]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

# Concurrency is managed by the reusable workflow (review.yml). Adding a concurrency block here
# would deadlock: github.workflow resolves to the caller's name in both contexts, making the
# group keys identical. The caller would hold the lock while the reusable waits for it.

jobs:
  review:
    uses: big-emotion/ferry/.github/workflows/review.yml@v0.6.0
    with:
      ticket_key: ${{ github.event.client_payload.ticket_key }}
      event_id: ${{ github.event.client_payload.event_id }}
      payload: ${{ toJson(github.event.client_payload) }}
    secrets: inherit
