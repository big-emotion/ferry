name: Ferry — Audit Daily

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

concurrency:
  group: ferry-audit-daily
  cancel-in-progress: true

jobs:
  audit-daily:
    uses: big-emotion/ferry/.github/workflows/audit-daily.yml@v1
    secrets: inherit
