<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>Ferry — agent loop</title>
  <desc>Four colored dots labeled R, D, V, I arranged in a cycle with arrows showing the autonomous loop.</desc>

  <!-- connecting arcs -->
  <g stroke="#1E3A5F" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 122 56 Q 144 64 144 86"/>
    <path d="M 144 114 Q 144 136 122 144"/>
    <path d="M 78 144 Q 56 136 56 114"/>
    <path d="M 56 86 Q 56 64 78 56"/>
  </g>

  <!-- arrowheads -->
  <g fill="#1E3A5F">
    <path d="M 144 86 L 140 78 L 148 78 Z"/>
    <path d="M 122 144 L 130 140 L 130 148 Z"/>
    <path d="M 56 114 L 60 122 L 52 122 Z"/>
    <path d="M 78 56 L 70 60 L 70 52 Z"/>
  </g>

  <!-- nodes -->
  <circle cx="100" cy="48" r="22" fill="#F5B638"/>
  <circle cx="152" cy="100" r="22" fill="#3FB8AF"/>
  <circle cx="100" cy="152" r="22" fill="#9B7BD4"/>
  <circle cx="48" cy="100" r="22" fill="#F08A8A"/>

  <!-- letters -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#1E3A5F" text-anchor="middle">
    <text x="100" y="56">R</text>
    <text x="152" y="108">D</text>
    <text x="100" y="160">V</text>
    <text x="48" y="108">I</text>
  </g>
</svg>
