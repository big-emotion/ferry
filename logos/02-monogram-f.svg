<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>Ferry — F monogram with hull</title>
  <desc>A capital F sitting on a curved boat hull, with a single coral wave beneath.</desc>

  <!-- F mark -->
  <g fill="#1E3A5F">
    <rect x="58" y="44" width="22" height="98"/>
    <rect x="58" y="44" width="76" height="22"/>
    <rect x="58" y="86" width="58" height="20"/>
  </g>

  <!-- hull -->
  <path d="M 30 138 L 170 138 Q 170 166 145 166 L 55 166 Q 30 166 30 138 Z" fill="#E8553F"/>

  <!-- porthole highlights on hull -->
  <circle cx="70" cy="152" r="3" fill="#FFE9DC"/>
  <circle cx="100" cy="152" r="3" fill="#FFE9DC"/>
  <circle cx="130" cy="152" r="3" fill="#FFE9DC"/>

  <!-- wave -->
  <path d="M 18 184 Q 38 178 58 184 T 98 184 T 138 184 T 178 184 T 192 184" stroke="#3FB8AF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
