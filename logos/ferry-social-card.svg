<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <title>Ferry — social card</title>
  <desc>GitHub social card with the Ferry mark, wordmark, and tagline.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9DC"/>
      <stop offset="1" stop-color="#FFD1B8"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1F33"/>
      <stop offset="1" stop-color="#1E3A5F"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- decorative sun -->
  <circle cx="1090" cy="160" r="80" fill="#FFB67A" opacity="0.85"/>

  <!-- background waves -->
  <g opacity="0.35">
    <path d="M 0 470 Q 80 460 160 470 T 320 470 T 480 470 T 640 470 T 800 470 T 960 470 T 1120 470 T 1280 470" stroke="#3FB8AF" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 0 510 Q 80 500 160 510 T 320 510 T 480 510 T 640 510 T 800 510 T 960 510 T 1120 510 T 1280 510" stroke="#1E3A5F" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 0 550 Q 80 542 160 550 T 320 550 T 480 550 T 640 550 T 800 550 T 960 550 T 1120 550 T 1280 550" stroke="#3FB8AF" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- mark, large, on the left -->
  <g transform="translate(80,180) scale(1.4)">
    <rect x="32" y="72" width="32" height="46" rx="3" fill="#F5B638"/>
    <rect x="32" y="72" width="32" height="7" rx="3" fill="#000000" opacity="0.18"/>
    <rect x="68" y="72" width="32" height="46" rx="3" fill="#3FB8AF"/>
    <rect x="68" y="72" width="32" height="7" rx="3" fill="#000000" opacity="0.18"/>
    <rect x="104" y="72" width="32" height="46" rx="3" fill="#9B7BD4"/>
    <rect x="104" y="72" width="32" height="7" rx="3" fill="#000000" opacity="0.18"/>
    <rect x="140" y="72" width="32" height="46" rx="3" fill="#F08A8A"/>
    <rect x="140" y="72" width="32" height="7" rx="3" fill="#000000" opacity="0.18"/>

    <rect x="26" y="118" width="152" height="6" rx="2" fill="#1E3A5F"/>
    <path d="M 22 124 L 182 124 Q 182 158 150 158 L 54 158 Q 22 158 22 124 Z" fill="#E8553F"/>
  </g>

  <!-- text block on the right -->
  <text x="500" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="140" font-weight="500" fill="#1E3A5F" letter-spacing="6">ferry</text>
  <text x="500" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="400" fill="#1E3A5F" opacity="0.75">From Jira ticket to merged PR, autonomously.</text>

  <!-- agent legend -->
  <g transform="translate(500,400)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#1E3A5F">
    <g>
      <rect x="0" y="0" width="20" height="20" rx="3" fill="#F5B638"/>
      <text x="30" y="16">Refiner</text>
    </g>
    <g transform="translate(160,0)">
      <rect x="0" y="0" width="20" height="20" rx="3" fill="#3FB8AF"/>
      <text x="30" y="16">Developer</text>
    </g>
    <g transform="translate(340,0)">
      <rect x="0" y="0" width="20" height="20" rx="3" fill="#9B7BD4"/>
      <text x="30" y="16">Reviewer</text>
    </g>
    <g transform="translate(510,0)">
      <rect x="0" y="0" width="20" height="20" rx="3" fill="#F08A8A"/>
      <text x="30" y="16">Iterator</text>
    </g>
  </g>
</svg>
