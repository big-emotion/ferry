<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>Ferry — handoff between lanes</title>
  <desc>Two Jira-style lanes with a small ferry crossing between them on a wave.</desc>

  <!-- left lane (source) -->
  <rect x="14" y="36" width="50" height="128" rx="6" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
  <rect x="22" y="46" width="34" height="14" rx="2" fill="#F5B638"/>
  <rect x="22" y="64" width="34" height="14" rx="2" fill="#3FB8AF" opacity="0.45"/>
  <rect x="22" y="82" width="34" height="14" rx="2" fill="#1E3A5F" opacity="0.15"/>

  <!-- right lane (destination) -->
  <rect x="136" y="36" width="50" height="128" rx="6" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
  <rect x="144" y="46" width="34" height="14" rx="2" fill="#9B7BD4"/>
  <rect x="144" y="64" width="34" height="14" rx="2" fill="#F08A8A" opacity="0.45"/>
  <rect x="144" y="82" width="34" height="14" rx="2" fill="#1E3A5F" opacity="0.15"/>

  <!-- ferry crossing the channel -->
  <g transform="translate(72,108)">
    <rect x="0" y="-6" width="56" height="6" rx="1.5" fill="#1E3A5F"/>
    <rect x="6" y="-18" width="10" height="12" rx="1.5" fill="#F5B638"/>
    <rect x="18" y="-18" width="10" height="12" rx="1.5" fill="#3FB8AF"/>
    <rect x="30" y="-18" width="10" height="12" rx="1.5" fill="#9B7BD4"/>
    <rect x="42" y="-18" width="10" height="12" rx="1.5" fill="#F08A8A"/>
    <path d="M 0 0 L 56 0 Q 56 16 42 16 L 14 16 Q 0 16 0 0 Z" fill="#E8553F"/>
  </g>

  <!-- wave under ferry -->
  <path d="M 64 138 Q 80 132 96 138 T 128 138 T 144 138" stroke="#3FB8AF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 70 150 Q 86 145 102 150 T 134 150" stroke="#1E3A5F" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
