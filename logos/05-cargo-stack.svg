<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>Ferry — cargo stack</title>
  <desc>Four containers stacked in two rows in the agent colors, slightly offset for depth.</desc>

  <!-- bottom row -->
  <g>
    <rect x="32" y="116" width="60" height="42" rx="4" fill="#F5B638"/>
    <rect x="32" y="116" width="60" height="6" rx="3" fill="#000000" opacity="0.18"/>
    <text x="62" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#1E3A5F">R</text>
  </g>
  <g>
    <rect x="108" y="116" width="60" height="42" rx="4" fill="#3FB8AF"/>
    <rect x="108" y="116" width="60" height="6" rx="3" fill="#000000" opacity="0.18"/>
    <text x="138" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#1E3A5F">D</text>
  </g>

  <!-- top row, offset -->
  <g>
    <rect x="50" y="64" width="60" height="42" rx="4" fill="#9B7BD4"/>
    <rect x="50" y="64" width="60" height="6" rx="3" fill="#000000" opacity="0.18"/>
    <text x="80" y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#1E3A5F">V</text>
  </g>
  <g>
    <rect x="118" y="64" width="60" height="42" rx="4" fill="#F08A8A"/>
    <rect x="118" y="64" width="60" height="6" rx="3" fill="#000000" opacity="0.18"/>
    <text x="148" y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" fill="#1E3A5F">I</text>
  </g>

  <!-- ground shadow -->
  <ellipse cx="100" cy="170" rx="68" ry="5" fill="#1E3A5F" opacity="0.14"/>
</svg>
