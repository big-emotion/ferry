<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>Ferry — flat silhouette</title>
  <desc>A simplified ferry hull carrying four containers in the agent colors, with two waves underneath.</desc>

  <!-- containers -->
  <rect x="34" y="74" width="32" height="44" rx="3" fill="#F5B638"/>
  <rect x="68" y="74" width="32" height="44" rx="3" fill="#3FB8AF"/>
  <rect x="102" y="74" width="32" height="44" rx="3" fill="#9B7BD4"/>
  <rect x="136" y="74" width="32" height="44" rx="3" fill="#F08A8A"/>

  <!-- container tops -->
  <rect x="34" y="74" width="32" height="6" rx="3" fill="#000000" opacity="0.15"/>
  <rect x="68" y="74" width="32" height="6" rx="3" fill="#000000" opacity="0.15"/>
  <rect x="102" y="74" width="32" height="6" rx="3" fill="#000000" opacity="0.15"/>
  <rect x="136" y="74" width="32" height="6" rx="3" fill="#000000" opacity="0.15"/>

  <!-- deck -->
  <rect x="28" y="118" width="146" height="6" rx="2" fill="#1E3A5F"/>

  <!-- hull -->
  <path d="M 24 124 L 178 124 Q 178 156 148 156 L 54 156 Q 24 156 24 124 Z" fill="#E8553F"/>

  <!-- waves -->
  <path d="M 14 170 Q 30 164 46 170 T 78 170 T 110 170 T 142 170 T 174 170 T 188 170" stroke="#3FB8AF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 20 184 Q 36 178 52 184 T 84 184 T 116 184 T 148 184 T 180 184" stroke="#1E3A5F" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
</svg>
